name: CI

# PR과 master push에서 빌드 + 테스트만 수행한다. 패키징은 하지 않아
# 비싼 macOS 러너 사용을 최소화한다. 문서만 바꾼 PR은 트리거되지 않는다.
on:
  push:
    branches: [master]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # SwiftPM 빌드 산출물을 캐시해 재빌드 시간을(=러너 분을) 줄인다.
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build
        run: swift build

      - name: Test
        run: swift test
