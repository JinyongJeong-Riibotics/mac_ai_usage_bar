name: Release

# master 병합 후 테스트 → 자동 버전 결정 → .app/ZIP/태그/Release 발행.
# VERSION은 다음 major/minor 버전의 하한이며, 이후 병합은 patch를 자동 증가한다.
on:
  workflow_dispatch:
    inputs:
      version:
        description: '버전 (예: 0.2.0). v<버전> 태그와 릴리즈가 생성된다'
        required: true
      prerelease:
        description: '프리릴리즈로 표시'
        type: boolean
        default: false
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  # Serialize version allocation and publication across automatic/manual/tag runs.
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      publish: ${{ steps.guard.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test version resolution
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Resolve version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            python3 scripts/release_version.py --version "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python3 scripts/release_version.py --version "$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/release_version.py >> "$GITHUB_OUTPUT"
          fi
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Guard release target and handle reruns
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            if [ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::$TAG points to a different commit. Choose a new version."
              exit 1
            fi
          fi
          # API errors must fail rather than being mistaken for a missing release.
          RELEASES=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          if printf '%s\n' "$RELEASES" | grep -Fxq "$TAG"; then
            if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "branch" ]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "$TAG already published; skipping this automatic rerun."
              exit 0
            fi
            echo "::error::Release $TAG already exists. Choose a new version."
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

  package:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test before publishing
        run: swift test

      - name: Build .app
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./scripts/build_app.sh

      - name: Zip .app
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ditto -c -k --keepParent \
            dist/MacAIUsageBar.app \
            "MacAIUsageBar-$VERSION.zip"

      # 설치 안내를 릴리즈 노트 맨 위에 붙인다. 그 아래로는 --generate-notes가
      # 커밋/PR 기반 변경 내역을 자동으로 이어 붙인다.
      - name: Compose release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cat > RELEASE_NOTES.md <<NOTES
          ## 설치

          1. 아래 \`MacAIUsageBar-$VERSION.zip\` 다운로드 → 압축 해제 → \`MacAIUsageBar.app\`을 \`/Applications\`로 이동
          2. **Gatekeeper 해제** — 터미널에서 아래 한 줄:
             \`\`\`sh
             xattr -dr com.apple.quarantine /Applications/MacAIUsageBar.app
             \`\`\`
          3. Dock 아이콘 없이 메뉴바에만 뜬다. 종료는 드롭다운의 전원 아이콘.

          ### "Apple은 악성 코드가 없음을 확인할 수 없습니다"가 뜬다면

          정상이다. Apple Developer 계정 없이 ad-hoc 서명만 한 앱이라 **공증(notarization)이
          없어서** 나는 경고이지, 앱이 손상된 게 아니다. 위 2번 명령으로 해제하면 된다.

          터미널을 쓰지 않겠다면: 앱을 한 번 실행해 경고를 띄운 뒤
          **시스템 설정 → 개인정보 보호 및 보안** → 아래로 스크롤 → **"확인 없이 열기"**.
          (macOS 15부터는 Finder에서 우클릭 → 열기로는 더 이상 우회되지 않는다.)

          Apple Silicon(arm64) 전용이다. Intel Mac에서는 동작하지 않는다.
          NOTES

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          ARGS=(--title "$TAG" --target "$GITHUB_SHA"
                --notes-file RELEASE_NOTES.md --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then ARGS+=(--prerelease); fi
          gh release create "$TAG" "MacAIUsageBar-$VERSION.zip" "${ARGS[@]}"
          echo "✅ https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
